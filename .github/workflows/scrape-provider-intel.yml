name: Weekly Provider Intelligence Scraper

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-sync:
    name: Scrape StreamCheck Providers & Sync Intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Provider Intelligence Sync Script
        run: |
          python project-strong/scripts/sync_provider_intel.py

      - name: Commit and Push Updated Knowledge Base
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add project-strong/provider_intelligence.json project-strong/android/app/src/main/assets/provider_intelligence.json
          if git diff --staged --quiet; then
            echo "No provider intelligence updates found."
          else
            git commit -m "chore(intel): automated weekly provider intelligence sync [skip ci]"
            git push origin main
          fi
