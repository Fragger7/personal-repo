name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'project-strong/android/**'
      - '.github/workflows/android-build.yml'
      - 'project-strong/.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: ./project-strong/android
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          cd project-strong/android/app/build/outputs/apk/release/
          mv app-release.apk sherlock-streams-v1.10.${{ github.run_number }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-streams-apk
          path: project-strong/android/app/build/outputs/apk/release/sherlock-streams-v1.10.${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.10.${{ github.run_number }}
          name: Release v1.10.${{ github.run_number }}
          draft: false
          prerelease: false
          files: project-strong/android/app/build/outputs/apk/release/sherlock-streams-v1.10.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
